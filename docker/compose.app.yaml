version: "3.8"

services:
  dashboard:
    image: noisyvis:latest
    container_name: noisyvis-app
    working_dir: /workspace
    # Stage 4: editable-installs the repo into `exp`, then execs the command in that environment.
    entrypoint: ["/workspace/docker/entrypoint.sh"]
    command: ["python","-m","noisyvis.mlflow_app.app"]
    environment:
      - TZ=Europe/London
    ports:
      - "8051:8051"
    volumes:
      - /home/ubuntucompute/code/NoisyVisualisation:/workspace:cached
      # NVMe persistent data; create_host_path: false refuses to start if /mnt/nvme is not mounted.
      - type: bind
        source: /mnt/nvme/data
        target: /workspace/data
        bind: {create_host_path: false}
    user: "57439:57439"
    restart: unless-stopped