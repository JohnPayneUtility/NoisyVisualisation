version: "3.8"
services:
  mlflow-ui:
    image: bitnami/mlflow:3.2.0
    container_name: mlflow-ui
    entrypoint: []  # reset any Portainer override
    user: "57439:57439"
    command: ["mlflow","ui",
              "--backend-store-uri","/workspace/data/mlruns",
              "--host","0.0.0.0","--port","5000"]
    # Deployed as the Portainer stack "mlflow"; keep this file and the stack in sync.
    # create_host_path: false refuses to start if /mnt/nvme is not mounted.
    volumes:
      - type: bind
        source: /mnt/nvme/data/mlruns
        target: /workspace/data/mlruns
        bind: {create_host_path: false}
    ports:
      - "5000:5000"
    restart: unless-stopped
    # The bitnami image has no curl or wget; probe MLflow's /health endpoint with its own Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s