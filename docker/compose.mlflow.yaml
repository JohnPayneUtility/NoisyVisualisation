version: "3.8"
services:
  mlflow-ui:
    image: bitnami/mlflow:3.2.0
    container_name: mlflow-ui
    entrypoint: []  # reset any Portainer override
    user: "57439:57439"
    command: ["mlflow","ui",
              "--backend-store-uri","/workspace/data/mlruns",
              "--host","0.0.0.0","--port","5000"]
    volumes:
      - /home/ubuntucompute/code/NoisyVisualisation/data/mlruns:/workspace/data/mlruns
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s