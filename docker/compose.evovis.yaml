version: "3.8"

services:
  runner:
    image: noisyvis:latest
    pull_policy: never            # don't try to pull from registry
    working_dir: /workspace

    # Bind-mount repo so code changes are live inside the container
    # user: "1000:1000"
    volumes:
      - /home/ubuntucompute/code/NoisyVisualisation:/workspace:cached
      # NVMe: persistent data and LMDB scratch are separate directories. create_host_path: false makes
      # Docker refuse to start if a source is missing (e.g. /mnt/nvme not mounted) instead of creating it.
      - type: bind
        source: /mnt/nvme/data
        target: /workspace/data
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/nvme/scratch
        target: /workspace/fast_storage
        bind: {create_host_path: false}

    environment:
      - MLFLOW_TRACKING_URI=http://192.168.0.66:5000
      - GIT_PYTHON_REFRESH=quiet
      - TZ=Europe/London

    # Stage 4: editable-installs the repo into `exp`, then execs the command in that environment.
    entrypoint: ["/workspace/docker/entrypoint.sh"]
    command: ["sleep","infinity"]

    restart: unless-stopped