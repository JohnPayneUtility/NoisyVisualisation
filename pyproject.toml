[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisyvis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []          # deliberately empty — conda owns the environment (R14)

[project.scripts]
noisyvis-dashboard = "noisyvis.dashboard.app:main"
noisyvis-mlflow    = "noisyvis.mlflow_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]
