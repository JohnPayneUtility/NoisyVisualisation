[pytest]
# This file anchors the pytest rootdir at /workspace/tests, so `python -m pytest tests`
# keeps every generated artefact (cache, bytecode) inside tests/ rather than the repo root.

# Makes `import harness.run_isolated` etc. resolve from tests/ without an __init__.py at
# the tests/ level and without depending on the caller's working directory.
pythonpath = .

testpaths = .

# -p no:cacheprovider: write no .pytest_cache anywhere in the repository.
# -ra: show the reason for every xfail/skip, which is how the Stage 1 gate is read.
addopts = -p no:cacheprovider -ra

# Every xfail in this suite is a documented, tracked defect. If one starts passing,
# the suite must fail so the allowlist cannot silently go stale.
xfail_strict = true
